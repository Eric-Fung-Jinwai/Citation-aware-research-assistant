services:

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine          # tiny official Redis image, no build needed
    ports:
      - "6379:6379"                # host:container
    restart: unless-stopped

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .                   # build context = project root (so COPY works)
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env                 # injects OPENAI_API_KEY, POLYGON_API_KEY, etc.
    environment:
      - REDIS_URL=redis://redis:6379   # "redis" resolves to the redis service above
    volumes:
      # Named volume so ChromaDB data survives container restarts
      - chromadb_data:/app/data/chromadb
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s            # give uvicorn time to start before checking
    restart: unless-stopped

  # ── Frontend (Streamlit) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      # "backend" resolves to the backend service — containers talk over Docker's
      # internal network, not through localhost
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy  # wait until /health returns 200 before starting
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  chromadb_data:                   # persists ChromaDB embeddings across restarts