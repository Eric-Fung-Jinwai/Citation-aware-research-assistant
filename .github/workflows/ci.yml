name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Offline tests ─────────────────────────────────────────────────────────────
  # Runs on every push and PR. No API keys needed — only tests marked "not live".
  test:
    name: Offline tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache the pip download cache keyed on requirements.txt so unchanged
      # dependency sets reuse the cached wheels instead of re-downloading.
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline tests
        run: pytest smoke_test.py -m "not live" -v

  # ── Docker image builds ───────────────────────────────────────────────────────
  # Runs only on pushes to main (not on PRs) and only if tests pass.
  # Purpose: catch broken Dockerfiles before they reach a deployment.
  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      # Buildx is needed for the build-push-action and enables layer caching via GHA cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false          # build only, no registry push yet
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
